<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MAHRAN — Кофейня{% endblock %}</title>
    <link rel="stylesheet" href="/MAHRAN Coffee/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-brand">
                <!-- ЛОГО: замени этот div на <img src="static/images/logo.png" class="logo-img"> -->
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img" alt="MAHRAN">
                <span>MAHRAN</span>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="/MAHRAN Coffee/templates/index.html">Главная</a>
                <a href="/MAHRAN Coffee/templates/menu.html">Меню</a>
                <a href="/MAHRAN Coffee/templates/about.html">О нас</a>
                <a href="/MAHRAN Coffee/templates/reviews.html">Отзывы</a>
                <a href="/MAHRAN Coffee/templates/contacts.html">Контакты</a>
            </div>
            <div class="burger" id="burger">
                <span></span><span></span><span></span>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-brand">
                <img src="/MAHRAN Coffee/static/css/images/image-30-09-26-10-27.png" alt="MAHRAN Coffee" class="site-logo">
                <span>MAHRAN</span>
            </div>
            <div class="footer-links">
               <a href="/MAHRAN Coffee/templates/index.html">Главная</a>
                <a href="/MAHRAN Coffee/templates/menu.html">Меню</a>
                <a href="/MAHRAN Coffee/templates/about.html">О нас</a>
                <a href="/MAHRAN Coffee/templates/reviews.html">Отзывы</a>
                <a href="/MAHRAN Coffee/templates/contacts.html">Контакты</a>
            </div>
            <div class="footer-info">
                <p>&copy; 2026 MAHRAN Coffee.</p>
                <p>Все права защищены.</p>
                
            </div>
        </div>
    </footer>

    <script src="/MAHRAN Coffee/static/css/js/main.js"></script>
</body>
</html>
